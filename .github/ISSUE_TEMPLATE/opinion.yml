name: 미래 조각에 의견 남기기
description: 이미 있는 조각에 공감, 반론, 보완할 점, 근거 자료를 보탭니다.
title: "[의견] "
labels: ["의견"]
body:
  - type: input
    id: piece
    attributes:
      label: 어떤 조각인가요?
      description: 웹사이트의 ‘의견 남기기’를 누르면 자동으로 채워집니다.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 의견의 종류
      options:
        - 공감해요
        - 다르게 생각해요
        - 이렇게 고치면 좋겠어요
        - 근거 자료가 있어요
    validations:
      required: true
  - type: textarea
    id: opinion
    attributes:
      label: 의견
    validations:
      required: true
